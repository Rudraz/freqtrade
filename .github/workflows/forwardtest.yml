name: Forward Test MeanReversionMomentum

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"   # runs daily at 01:00 UTC

jobs:
  forwardtest:
    runs-on: raspberry-pi

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Decode config from secret
        run: |
          echo "${{ secrets.FT_CONFIG_JSON_BASE64 }}" | base64 -d > freqtrade/user_data/config.json
          echo "✅ Config decoded"

      - name: Pull Freqtrade Docker Image
        run: docker pull freqtradeorg/freqtrade:stable

      - name: Download Latest Market Data (Bybit)
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/freqtrade/user_data:/freqtrade/user_data" \
            freqtradeorg/freqtrade:stable \
            download-data \
              --exchange binance \
              --timeframe 5m \
              --days 2

      - name: Run Forward Test (Last 24h)
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/freqtrade/user_data:/freqtrade/user_data" \
            freqtradeorg/freqtrade:stable \
            backtesting \
              --config /freqtrade/user_data/config.json \
              --strategy MeanReversionMomentum \
              --timeframe 5m \
              --export trades \
              --export-filename /freqtrade/user_data/backtest_results/ForwardTest_MeanReversionMomentum.json

      - name: Upload forwardtest results
        uses: actions/upload-artifact@v4
        with:
          name: forwardtest-meanreversion
          path: freqtrade/user_data/backtest_results/**

